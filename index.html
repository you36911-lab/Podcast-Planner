<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>K-Dramatic Girls · Planner</title>
<!-- private planner: keep it out of search engines -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/webp" href="logo.webp">
<!-- fonts/, images/ and logo.webp sit next to this file -->
<link rel="preload" href="fonts/BodoniModa-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/InstrumentSans-Variable.woff2" as="font" type="font/woff2" crossorigin>
<!-- Korean: Gowun Batang, a soft myeongjo, served by Google Fonts (it only downloads the Hangul you actually use).
     Only the Bold weight is loaded on purpose: the regular one looked faint at small sizes,
     so every bit of Korean uses Bold while English keeps its own weights. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<div class="binder">
  <header class="top">
    <a class="brand" href="#dashboard" aria-label="Dashboard">
      <img class="logo" src="logo.webp" alt="">
      <span class="brand-text"><span id="podName" class="pod-name">K-Dramatic Girls</span><span class="script">planner</span></span>
    </a>
    <div class="me" role="group" aria-label="Writing as">
      <span class="me-label">Writing as</span>
      <button type="button" class="who-btn cat" data-act="me" data-who="cat" aria-pressed="false">Cat</button>
      <button type="button" class="who-btn mandu" data-act="me" data-who="mandu" aria-pressed="false">Mandu</button>
    </div>
    <a class="sync" id="syncPill" href="#settings">Saved on this device</a>
  </header>

  <nav class="tabs" aria-label="Planner">
    <a href="#dashboard" data-view="dashboard">Dashboard</a>
    <a href="#episodes" data-view="episodes">Episodes</a>
    <a href="#calendar" data-view="calendar">Calendar</a>
    <a href="#todos" data-view="todos">To-do</a>
    <a href="#ideas" data-view="ideas">Ideas</a>
    <a href="#settings" data-view="settings">Settings</a>
  </nav>

  <main id="main" tabindex="-1">
    <div id="notice" class="notice" role="status" hidden></div>
    <div id="view"></div>
  </main>
</div>

<!-- shared-planner settings (Firebase). Leave as is to keep everything on this device only. See README.md -->
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
